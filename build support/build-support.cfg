# build-support.cfg - build configuration for the Build Support VI package.
# This is the package that installs build.bat, the templates and the g-cli tools
# onto a build machine, so it is the one to release after changing any of those.
# Run it with:  build.bat "<repo root>" release build-support
# Format: KEY=VALUE, one per line. A '#' at column 0 is a whole-line comment.
# Do NOT put an inline comment after a value - it becomes part of the value.

# What to build. The package has no application or installer, so no APP_SPEC /
# INST_SPEC is needed; vipBuild also does its own build-number bump.
BUILD_VIP=true
BUILD_INSTALLER=false

# Run the git release step (commit/merge/tag/push + GitHub release)?
# (Independent of the build-number bump: vipBuild bumps it when BUILD_VIP=true,
# otherwise the script bumps it when BUILD_VIP=false. Neither commits the vipb.)
DO_RELEASE=true

# Tag namespace, so this repo's two products don't share one tag space.
# Tags through 1.11.2 were bare; from 1.11.3 on they are prefixed.
TAG_PREFIX=build-support/

# Which product in this repo to build.
VIPB=Build Support.vipb
LVPROJ=build-support.lvproj

# Optional overrides - uncomment to use.
# LVVER / LVBIT default to the .vipb's Package_LabVIEW_Version:
# LVVER=2019
# LVBIT=64
# PUBLISHER=Levylab
