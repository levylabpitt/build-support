# build.cfg - the default build configuration for this repo, read by build.bat
# when no config is named on the command line (which is how the GUI runs it).
# Here that default is the Patrick Builder application; the Build Support VI
# package has its own build-support.cfg alongside this file.
# Format: KEY=VALUE, one per line. A '#' at column 0 is a whole-line comment.
# Do NOT put an inline comment after a value - it becomes part of the value.
# Values may contain spaces.

# What to build:
BUILD_VIP=false
BUILD_INSTALLER=true

# Build-spec names in the .lvproj (only used when BUILD_INSTALLER=true).
# Convention: "<Product> Application" / "<Product> Installer".
APP_SPEC=Patrick Builder Application
INST_SPEC=Patrick Builder Installer

# Run the git release step (commit/merge/tag/push + GitHub release)?
# (Independent of the build-number bump: vipBuild bumps it when BUILD_VIP=true,
# otherwise the script bumps it when BUILD_VIP=false. The bump runs before the
# release, so a release commit carries it; with no release it is left uncommitted.)
DO_RELEASE=true

# Tag namespace, so this repo's two products don't share one tag space.
# Tags through 1.4.1.48 were bare; from 1.4.1.49 on they are prefixed.
TAG_PREFIX=patrick-builder/

# Optional overrides - uncomment to use.
# LVVER / LVBIT default to the .vipb's Package_LabVIEW_Version:
# LVVER=2019
# LVBIT=64
VIPB=Patrick Builder.vipb
LVPROJ=build-support.lvproj
# APP_NAME=Patrick Builder
# PUBLISHER=Levylab
